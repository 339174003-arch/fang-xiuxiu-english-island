const gradeOrder=[6,5,4,3,2,1],cards=document.getElementById('levelCards');
cards.innerHTML=gradeOrder.map((g,i)=>{const c=curriculum[g];return `<article class="level g${g}"><div class="level-label"><span class="level-icon">${c.icon}</span><h3>${c.name}</h3><span class="difficulty">${c.badge}</span></div><p>${c.topics}</p><div class="tags">重点：${c.items.length} 个单词与句型</div><div class="level-bottom"><span class="count">${g===6?'高阶':g>=4?'进阶':g>=2?'基础':'入门'} · 12 题</span><button class="go" onclick="startGame(${g})">开始闯关 →</button></div></article>`}).join('');
let round=[],idx=0,correct=0,locked=false,score=Number(localStorage.getItem('fxxy-stars')||0),todayCount=0,listenMode=false,audioCtx=null;
document.getElementById('stars').textContent=score+' 颗';
function shuffle(list){return [...list].sort(()=>Math.random()-.5)}
function startGame(which){listenMode=which==='listen';if(which==='mixed'||listenMode){const pool=gradeOrder.flatMap(g=>curriculum[g].items.map(x=>({en:x[0],zh:x[1],opts:x[2],emoji:x[3],grade:g})));round=shuffle(pool).slice(0,listenMode?10:12)}else{const g=Number(which)||2;round=curriculum[g].items.map(x=>({en:x[0],zh:x[1],opts:x[2],emoji:x[3],grade:g}))}idx=0;correct=0;renderGame();document.getElementById('modal').classList.add('show');speakCurrent()}
function speak(text){if(!('speechSynthesis'in window)){toast('这个浏览器暂不支持英语朗读');return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=.78;utterance.pitch=1;const voices=speechSynthesis.getVoices();utterance.voice=voices.find(v=>/^en(-|_)(US|GB)/i.test(v.lang))||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.speak(utterance)}
function speakCurrent(){if(round[idx])speak(round[idx].en)}
function playTone(isCorrect){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;audioCtx=audioCtx||new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume();const notes=isCorrect?[660,880,1050]:[260,190];notes.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=isCorrect?'sine':'triangle';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime+i*.12);gain.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+i*.12+.02);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+i*.12+.18);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+i*.12);osc.stop(audioCtx.currentTime+i*.12+.2)})}catch(e){}}
function renderGame(){const g=document.getElementById('game');if(idx>=round.length){g.innerHTML=`<div class="result"><div class="big">${correct>=Math.ceil(round.length*.75)?'🏆':'🎈'}</div><h2>${correct===round.length?'太厉害啦！':correct>=Math.ceil(round.length*.6)?'做得真棒！':'继续加油！'}</h2><p>本关答对 <strong>${correct} / ${round.length}</strong> 题，获得 <strong>${correct*2} 颗星星</strong></p><button class="primary" onclick="closeGame()">收下奖励，继续探险</button></div>`;score+=correct*2;todayCount+=round.length;localStorage.setItem('fxxy-stars',String(score));document.getElementById('stars').textContent=score+' 颗';playTone(true);return}locked=false;const w=round[idx];const subtitle=listenMode?'先听英语，再选出正确意思':`小学${w.grade}年级 · 听一听，再选出正确意思`;g.innerHTML=`<div class="game-top"><div><h2>✨ ${listenMode?'听音找朋友':'英语单词探险'}</h2><p>第 ${idx+1} / ${round.length} 题 · 答对收集星星</p></div></div><div class="progress"><span style="width:${idx/round.length*100}%"></span></div><div class="question"><div class="q-emoji">${w.emoji}</div><div class="q-word">${listenMode?'听发音来猜一猜':w.en}</div><div class="q-sub">${subtitle}</div><button class="listen" onclick="speakCurrent()">🔊 再听一次（慢速）</button></div><div class="answers">${shuffle(w.opts).map(o=>`<button class="answer" onclick='choose(this,${JSON.stringify(o)},${JSON.stringify(w.zh)})'>${o}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="nextrow"><button class="next" id="next" onclick="idx++;renderGame();speakCurrent()">${idx===round.length-1?'看结果':'下一题'} →</button></div>`}
function choose(btn,val,answer){if(locked)return;locked=true;const ok=val===answer;playTone(ok);if(ok){correct++;btn.classList.add('correct');document.getElementById('feedback').textContent='答对啦！跟着再读一遍，记得更牢 ✨';document.getElementById('feedback').style.color='#43aa75'}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='正确答案是「'+answer+'」，听一听再记一次 💪';document.getElementById('feedback').style.color='#e2766a';document.querySelectorAll('.answer').forEach(b=>{if(b.textContent===answer)b.classList.add('correct')})}speakCurrent();document.getElementById('next').style.display='block'}
function closeGame(){document.getElementById('modal').classList.remove('show');if('speechSynthesis'in window)speechSynthesis.cancel()}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeGame()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGame()});function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
</script>
