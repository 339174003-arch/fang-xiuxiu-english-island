let round=[],idx=0,correct=0,locked=false,score=Number(localStorage.getItem('fxxy-stars')||0),todayCount=0,listenMode=false,audioCtx=null,speechQueue='',activeSpeech='',speechAudio=null,speechGeneration=0,micStream=null,micContext=null,micFrame=0,recognition=null,followItems=[],micRequest=0,followReady=false,followSpoken=false;

function shuffle(list){return [...list].sort(()=>Math.random()-.5)}
function startGame(which){stopFollowAlong();listenMode=which==='listen';if(which==='mixed'||listenMode){const pool=gradeOrder.flatMap(g=>curriculum[g].items.map(x=>({en:x[0],zh:x[1],opts:x[2],emoji:x[3],grade:g})));round=shuffle(pool).slice(0,listenMode?10:12)}else{const g=Number(which)||2;round=shuffle(curriculum[g].items.map(x=>({en:x[0],zh:x[1],opts:x[2],emoji:x[3],grade:g}))).slice(0,12)}idx=0;correct=0;renderGame();document.getElementById('modal').classList.add('show');speakCurrent()}
function selectEnglishVoice(voices){const english=voices.filter(v=>/^en[-_]us(?:$|[-_])/i.test(v.lang));const priority=[/jenny.*natural/i,/aria.*natural/i,/emma.*natural/i,/ava.*natural/i,/samantha/i,/\bava\b/i,/google us english/i,/\bzira\b/i,/\bmichelle\b/i,/\ballison\b/i];for(const pattern of priority){const match=english.find(v=>pattern.test(v.name));if(match)return match}return english.find(v=>/female|woman/i.test(v.name))||english[0]||voices.find(v=>/^en[-_]/i.test(v.lang))||null}
function speak(text,onComplete){const phrase=String(text).trim();if(!phrase)return;stopSpeech();const token=++speechGeneration;activeSpeech=phrase;const finish=ok=>{if(token!==speechGeneration)return;activeSpeech='';speechAudio=null;if(onComplete)onComplete(ok)};if('speechSynthesis'in window&&typeof SpeechSynthesisUtterance!=='undefined'){try{const utterance=new SpeechSynthesisUtterance(phrase);utterance.lang='en-US';utterance.rate=.84;utterance.pitch=1.04;const voice=selectEnglishVoice(speechSynthesis.getVoices());if(voice){utterance.voice=voice;utterance.lang=voice.lang}utterance.onend=()=>finish(true);utterance.onerror=()=>playSpeechFallback(phrase,token,finish);speechSynthesis.speak(utterance);return}catch(e){}}playSpeechFallback(phrase,token,finish)}
function playSpeechFallback(phrase,token,finish,attempt=0){if(token!==speechGeneration)return;const urls=[()=>`https://translate.googleapis.com/translate_tts?client=gtx&sl=en&tl=en&dt=t&q=${encodeURIComponent(phrase)}`,()=>`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(phrase)}&type=2`];if(attempt>=urls.length){finish(false);return}try{const audio=new Audio(urls[attempt]());speechAudio=audio;let advanced=false;const retry=()=>{if(advanced||token!==speechGeneration)return;advanced=true;playSpeechFallback(phrase,token,finish,attempt+1)};audio.onended=()=>{advanced=true;finish(true)};audio.onerror=retry;const result=audio.play();if(result&&result.catch)result.catch(retry)}catch(e){playSpeechFallback(phrase,token,finish,attempt+1)}}
function speakNow(phrase){speak(phrase)}
function stopSpeech(){speechQueue='';activeSpeech='';speechGeneration++;if('speechSynthesis'in window)speechSynthesis.cancel();if(speechAudio){speechAudio.pause();speechAudio.removeAttribute('src');speechAudio.load();speechAudio=null}}
function speakCurrent(){if(round[idx])speak(round[idx].en)}
function playTone(isCorrect){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;audioCtx=audioCtx||new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume();const notes=isCorrect?[660,880,1050]:[260,190];notes.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=isCorrect?'sine':'triangle';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime+i*.12);gain.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+i*.12+.02);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+i*.12+.18);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+i*.12);osc.stop(audioCtx.currentTime+i*.12+.2)})}catch(e){}}
function renderGame(){const g=document.getElementById('game');if(idx>=round.length){g.innerHTML=`<div class="result"><div class="big">${correct>=Math.ceil(round.length*.75)?'🏆':'🎈'}</div><h2>${correct===round.length?'太厉害啦！':correct>=Math.ceil(round.length*.6)?'做得真棒！':'继续加油！'}</h2><p>本关答对 <strong>${correct} / ${round.length}</strong> 题，获得 <strong>${correct*2} 颗星星</strong></p><button class="primary" onclick="closeGame()">收下奖励，继续探险</button></div>`;score+=correct*2;todayCount+=round.length;localStorage.setItem('fxxy-stars',String(score));document.getElementById('stars').textContent=score+' 颗';playTone(true);return}locked=false;const w=round[idx];const subtitle=listenMode?'先听英语，再选出正确意思':`小学${w.grade}年级 · 标准美音慢速朗读`;g.innerHTML=`<div class="game-top"><div><h2>✨ ${listenMode?'听音找朋友':'英语单词探险'}</h2><p>第 ${idx+1} / ${round.length} 题 · 答对收集星星</p></div></div><div class="progress"><span style="width:${idx/round.length*100}%"></span></div><div class="question"><div class="q-emoji">${w.emoji}</div><div class="q-word">${listenMode?'听发音来猜一猜':w.en}</div><div class="q-sub">${subtitle}</div><button class="listen" onclick="speakCurrent()">🔊 女声重听（慢速）</button></div><div class="answers">${shuffle(w.opts).map(o=>`<button class="answer" onclick='choose(this,${JSON.stringify(o)},${JSON.stringify(w.zh)})'>${o}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="nextrow"><button class="next" id="next" onclick="idx++;renderGame();speakCurrent()">${idx===round.length-1?'看结果':'下一题'} →</button></div>`}
function choose(btn,val,answer){if(locked)return;locked=true;const ok=val===answer;playTone(ok);if(ok){correct++;btn.classList.add('correct');document.getElementById('feedback').textContent='答对啦！再听一遍，开口读一次，记得更牢 ✨';document.getElementById('feedback').style.color='#43aa75'}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='正确答案是「'+answer+'」，听一听再记一次 💪';document.getElementById('feedback').style.color='#e2766a';document.querySelectorAll('.answer').forEach(b=>{if(b.textContent===answer)b.classList.add('correct')})}document.getElementById('next').style.display='block'}
function startFollowAlong(){stopFollowAlong();stopSpeech();listenMode=false;followItems=shuffle(gradeOrder.flatMap(g=>curriculum[g].items.map(x=>({en:x[0],zh:x[1],emoji:x[3]})))).slice(0,8);idx=0;renderFollowAlong();document.getElementById('modal').classList.add('show')}
function renderFollowAlong(){const item=followItems[idx];followReady=false;followSpoken=false;document.getElementById('game').innerHTML=`<div class="game-top"><div><h2>🗣️ 开口跟读</h2><p>第 ${idx+1} / ${followItems.length} 句 · 听完标准音，再完成本句</p></div></div><div class="progress"><span style="width:${(idx+1)/followItems.length*100}%"></span></div><div class="question"><div class="q-emoji">${item.emoji}</div><div class="q-word">${item.en}</div><div class="q-sub">${item.zh}</div><button class="listen" id="standardButton" onclick="playFollowStandard()">🔊 听标准读音</button></div><div class="mic-panel"><div class="mic-status" id="micStatus">先播放并听完标准音，再开始跟读。</div><div class="mic-meter" aria-label="本地麦克风音量"><span id="micLevel"></span></div><div class="follow-actions"><button class="start-mic" id="micButton" onclick="startMic()">🎙️ 开始跟读</button><button class="next-follow" id="nextFollowButton" disabled onclick="nextFollow()">${idx===followItems.length-1?'完成练习':'下一句'} →</button></div><p class="mic-note">🔒 麦克风声音只在本机检测；支持时才启用本机离线英语识别，不上传录音。</p></div>`}
function playFollowStandard(){const status=document.getElementById('micStatus'),button=document.getElementById('standardButton'),next=document.getElementById('nextFollowButton');button.disabled=true;button.textContent='🔊 正在播放标准音…';status.textContent='正在播放，请听完整句子。';speak(followItems[idx].en,ok=>{button.disabled=false;button.textContent=ok?'🔊 再听一次标准音':'🔁 重试标准音';if(ok){followReady=true;next.disabled=!followSpoken;status.textContent=followSpoken?'听到你的跟读啦！可以进入下一句。':'标准音播放完成。点击「开始跟读」，听到你的声音后才能继续。'}else{status.textContent='标准音播放失败，请检查网络后重试。'}})}
async function startMic(){const status=document.getElementById('micStatus');const button=document.getElementById('micButton');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='此浏览器不支持麦克风，请使用最新版 Safari 或 Chrome';return}const request=++micRequest;button.disabled=true;status.textContent='正在请求麦克风权限…';try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});if(request!==micRequest||!document.getElementById('modal').classList.contains('show')){stream.getTracks().forEach(track=>track.stop());return}micStream=stream;const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){micContext=new Ctx();const analyser=micContext.createAnalyser();analyser.fftSize=512;micContext.createMediaStreamSource(micStream).connect(analyser);const data=new Uint8Array(analyser.fftSize);const meter=document.getElementById('micLevel');let voiceFrames=0;const draw=()=>{if(!micContext||!meter)return;analyser.getByteTimeDomainData(data);let sum=0;for(const v of data){const n=(v-128)/128;sum+=n*n}const rms=Math.sqrt(sum/data.length);meter.style.width=Math.min(100,Math.max(3,Math.round(rms*360)))+'%';if(followReady&&rms>.028){voiceFrames++;if(voiceFrames>6&&!followSpoken){followSpoken=true;document.getElementById('nextFollowButton').disabled=false;status.textContent='听到你的跟读啦！可以进入下一句。'}}else if(rms<.012)voiceFrames=0;micFrame=requestAnimationFrame(draw)};draw()}status.textContent='麦克风已开启，读出上面的英语句子吧！';button.textContent='🎙️ 正在聆听';await tryLocalRecognition(status,request)}catch(err){if(request!==micRequest||!status.isConnected)return;status.textContent=err.name==='NotAllowedError'?'没有麦克风权限；可在浏览器地址栏旁允许麦克风后重试。':'无法开启麦克风，请检查设备设置。';button.disabled=false}}
async function tryLocalRecognition(status,request){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||!('processLocally'in SR.prototype)){status.textContent='本机离线英语识别暂不可用；麦克风音量提示已开启，跟着上方句子读就好。';return}try{if(SR.available){const availability=await SR.available({langs:['en-US'],processLocally:true});if(request!==micRequest)return;if(availability!=='available'){status.textContent='本机没有离线英语语音包；录音不会上传，音量提示仍可帮助你跟读。';return}}if(request!==micRequest)return;recognition=new SR();recognition.lang='en-US';recognition.processLocally=true;recognition.continuous=false;recognition.interimResults=true;recognition.onresult=e=>{const heard=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();if(heard)status.textContent='本机听到：'+heard+' · 再听一遍，试着读得更清楚！'};recognition.onerror=e=>{if(e.error!=='no-speech'&&status.isConnected)status.textContent='本机识别暂不可用，仍可按上方句子继续跟读。'};recognition.onend=()=>{recognition=null};recognition.start();status.textContent='本机离线识别已开启，放心大声读出来！'}catch(e){if(status.isConnected)status.textContent='音量提示已开启，跟着上方句子读就好。'}}
function stopFollowAlong(){micRequest++;if(recognition){try{recognition.abort()}catch(e){}recognition=null}if(micFrame)cancelAnimationFrame(micFrame);micFrame=0;if(micStream){micStream.getTracks().forEach(track=>track.stop());micStream=null}if(micContext){micContext.close().catch(()=>{});micContext=null}}
function nextFollow(){if(!followReady||!followSpoken){toast(!followReady?'先听完本句标准音，再继续哦':'请点击开始跟读并读出本句，再进入下一句');return}stopFollowAlong();if(idx<followItems.length-1){idx++;renderFollowAlong()}else{document.getElementById('game').innerHTML='<div class="result"><div class="big">🌟</div><h2>跟读练习完成！</h2><p>今天开口练习了 '+followItems.length+' 句，继续坚持就会越来越棒！</p><button class="primary" onclick="closeGame()">完成</button></div>'}}
function closeGame(){stopFollowAlong();stopSpeech();document.getElementById('modal').classList.remove('show')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeGame()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGame()});function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
</script>
